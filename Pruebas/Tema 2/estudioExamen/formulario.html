<!DOCTYPE html>

<html>

    <head>
        <meta charset="UTF-8">
        <title>Formulario de pedidos Panadería La Miga</title>
    </head>

    <body>

        <header>
            <h1>Formulario de pedidos</h1>
            <p>Formulario de pedidos - <strong>Panadería La Miga</strong>.</p>
        </header>

        <hr>
        <br>

        <p>Volver a la página principal: <a href="index.html">Página principal</a>.</p>

        <br>

        <main>
            <form action="index.html" method="POST">
                <fieldset>
                    <legend>Datos personales</legend>

                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nombre" size="20" required>

                    <br><br>

                    <label for="apellidos">Apellidos:</label>
                    <input type="text" name="apellidos" id="apellidos" size="30" required>

                    <br><br>

                    <label for="correo">Correo electrónico:</label>
                    <input type="email" name="correo" id="correo" size="40" required>

                    <br><br>

                    <label for="telefono">Teléfono:</label>
                    <input type="tel" name="telefono" id="telefono" size="10" required>
                </fieldset>

                <br><br>

                <fieldset>
                    <legend>Pedido</legend>

                    <p>Número de pasteles:</p>

                        <input type="radio" id="1pastel" name="numeroPasteles" checked>
                        <label for="1pastel">1 Pastel</label>
                        
                        <br>

                        <input type="radio" id="2pasteles" name="numeroPasteles">
                        <label for="2pasteles">2 Pasteles</label>

                        <br>

                        <input type="radio" id="3pasteles" name="numeroPasteles">
                        <label for="3pasteles">3 Pasteles</label>

                        <br><br>

                        <label for="pastel">¿Qué pastel/pasteles va a pedir?</label>

                        <br><br>

                        <select name="pastel" id="pastel">
                            <option value="nada" disabled selected>Seleccione su producto:</option>
                            <optgroup label="Panadería diaria">
                                <option value="barras">Barras tradicionales</option>
                                <option value="integrales">Integrales de trigo y espelta</option>
                                <option value="chapatas">Chapatas de masa madre</option>
                            </optgroup>

                            <optgroup label="Repostería artesanal">
                                <option value="napolitana">Napolitana</option>
                                <option value="roscon">Roscón</option>
                            </optgroup>

                        </select>
                </fieldset>

                <br><br>

                <fieldset>
                    <legend>Comentarios</legend>
                    <label for="comentarios">Escriba aquí su opinión:</label>
                    <textarea cols="50" rows="5" name="comentarios" id="comentarios" spellcheck="true"></textarea>
                </fieldset>

                <br>

                <input type="submit" value="Enviar">
                <input type="reset" value="Limpiar">
            </form>
        </main>

        <footer>
        </footer>
    </body>

</html>
