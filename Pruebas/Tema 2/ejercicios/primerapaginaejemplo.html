<!DOCTYPE html>

<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Abraham Teba Ojeda">
        <meta name="description" content="Lista de selección práctica clase">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de selección en clase</title>
    </head>

    <body>
        <header>
            <h1>DESTINOS TURÍSTICOS</h1>
        </header>

        <main>
            <form action="" method="get">
                <fieldset>
                    <legend>Destinos turísticos</legend>
                    <select name="destinos" multiple size="5">
                        <optgroup label="Europa">
                            <option value="paris">París</option>
                            <option value="berlin">Berlín</option>
                            <option value="roma">Roma</option>
                            <option value="amsterdam">Ámsterdam</option>
                        </optgroup>

                        <optgroup label="América">
                            <option value="riodejaneiro">Río de Janeiro</option>
                            <option value="lahabana">La Habana</option>
                            <option value="puntacana">Punta Cana</option>
                            <option value="nuevayork">Nueva York</option>
                        </optgroup>
                    </select>
                </fieldset>
			</form>
        </main>

        <footer>
        </footer>
    </body>
</html>
