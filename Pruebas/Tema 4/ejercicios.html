<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/actividadescss.css">
    <title>Gestión de elementos desde JS</title>
</head>

<body>
    <header>
    </header>

    <main>
        <h2>Incorpora un enlace a una URL en un párrafo / añade un nuevo elemento tipo párrafo y elimina el párrafo 2.</h2>

        <p>1. Párrafo primero</p>
        <p>2. Párrafo segundo</p>
        <p>3. Párrafo tercero</p>
        <p>4. Párrafo cuarto</p>
        <p>5. Párrafo quinto</p>
    </main>

    <footer>
    </footer>

    <script>
        let coleccionP = document.querySelectorAll("p");
        
        let linkExterno = document.createElement("a");
        linkExterno.href = "https://www.google.com";
        linkExterno.innerHTML = " - Visitar enlace";
        
        coleccionP[2].appendChild(linkExterno);

        let parrafoExtra = document.createElement("p");
        parrafoExtra.innerHTML = "Este texto ha sido generado mediante script";
        parrafoExtra.style.color = "crimson";

        let contenedorBody = document.body;
        contenedorBody.insertBefore(parrafoExtra, coleccionP[3]);

        if (coleccionP.length > 1) {
            contenedorBody.removeChild(coleccionP[1]);
        }
    </script>  
</body>

</html>
