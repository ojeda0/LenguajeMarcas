<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Primos</title>
    <script>
        function comprobarPrimo(valor) {
            if (valor <= 1) return false;
            for (let x = 2; x <= Math.sqrt(valor); x++) {
                if (valor % x == 0) return false;
            }
            return true;
        }

        function procesarFormulario() {
            let cajaTexto = document.getElementById("campoNumero");
            let visorResultado = document.getElementById("mensajeSalida");
            let cifraDigitada = parseInt(cajaTexto.value);

            if (isNaN(cifraDigitada)) {
                visorResultado.innerText = "Error: Escribe un número válido.";
                visorResultado.style.color = "red";
            } else {
                let esValido = comprobarPrimo(cifraDigitada);
                let textoFinal = esValido ? " es un número primo" : " no es un número primo";
                
                visorResultado.innerText = "El " + cifraDigitada + textoFinal;
                visorResultado.style.color = esValido ? "green" : "orange";
            }
        }
    </script>
</head>

<body>
    <header>
    </header>

    <main>
        <h1>Detector de Números Primos</h1>
        
        <form onsubmit="event.preventDefault(); procesarFormulario();">
            <label for="campoNumero">Introduce el número:</label>
            <input type="number" id="campoNumero" required>
            <button type="submit">Analizar</button>
        </form>

        <p id="mensajeSalida"></p>
    </main>

    <footer>
    </footer>
</body>

</html>
